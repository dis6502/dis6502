name: Release

# Builds a portable, no-install-needed app image for Windows, Linux and
# macOS via jpackage (bundling the JVM, so end users need no Java install of
# their own) and publishes them as assets on a GitHub Release.
#
# One asset per operating system and processor, named
# dis6502-<platform>-<arch>: jpackage bundles the runner's own Java
# runtime, so an image runs only on the architecture it was built on.
# There is no cross compilation - each architecture needs its own runner
# (the same matrix as RASTER-Music-Tracker, see plans/11_RELEASE_MATRIX_PROPOSAL.md):
#
#   windows  x64      windows-latest
#   windows  aarch64  windows-11-arm
#   linux    x64      ubuntu-latest
#   linux    aarch64  ubuntu-24.04-arm
#   macos    x64      macos-15-intel  (macos-13 was retired; macos-14 is
#                                    deprecated, so 15 is the oldest Intel
#                                    image still offered)
#   macos    aarch64  macos-latest    (Apple Silicon)
#
# macos-latest has been Apple Silicon since 2024, so the former
# dis6502-macos-x64 asset was actually ARM64; it is dis6502-macos-aarch64
# now and Intel Macs have their own (2026-10-02). The ARM runners are free
# for public repositories.
#
# The icons are build/icons/dis6502.ico (Windows) and .icns (macOS), made
# by build/make-icons.py from src/images/main-*.png; Linux takes the 64x64
# PNG directly.
#
# Trigger: push a tag matching v*, e.g. `git tag v4.0.0 && git push origin v4.0.0`
# (the Java port continues the version line the Windows/C++ builds left off at
# 3.6.1 - see README.md's History section - so the first tag here is v4.0.0,
# not v1.0.0).
#
# Can also be run manually (workflow_dispatch):
# - With the release_tag input left empty: a plain test build - no release is
#   published, only build artifacts you can download from the workflow run.
# - With release_tag set to an EXISTING release's tag (e.g. v4.0.0): rebuilds
#   whatever the triggering branch currently is and republishes those binaries
#   to that release, without moving the git tag itself - useful for shipping
#   a fixed build under the same version number without creating a new tag.
#   softprops/action-gh-release updates the existing release's assets/notes
#   in place; the tag keeps pointing at whatever commit it always did.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to rebuild and republish assets for (leave empty for a plain test build)"
        required: false
        type: string

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
            icon: dis6502/build/icons/dis6502.ico
          - os: windows-11-arm
            platform: windows
            arch: aarch64
            icon: dis6502/build/icons/dis6502.ico
          - os: ubuntu-latest
            platform: linux
            arch: x64
            icon: dis6502/src/images/main-64x64.png
          - os: ubuntu-24.04-arm
            platform: linux
            arch: aarch64
            icon: dis6502/src/images/main-64x64.png
          - os: macos-15-intel
            platform: macos
            arch: x64
            icon: dis6502/build/icons/dis6502.icns
          - os: macos-latest
            platform: macos
            arch: aarch64
            icon: dis6502/build/icons/dis6502.icns
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout dis6502
        uses: actions/checkout@v5
        with:
          path: dis6502

      - name: Checkout WUDSN-Base
        uses: actions/checkout@v5
        with:
          repository: wudsn/wudsn-base
          path: wudsn-base

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Install WUDSN-Base into the local Maven repo
        run: mvn -B -ntp install
        working-directory: wudsn-base

      - name: Build the dis6502 shaded jar
        # The tests run as part of the build; the ones that need a display are skipped here.
        run: mvn -B -ntp package "-Ddis6502.skipUITests=true"
        working-directory: dis6502

      - name: Determine app version
        id: version
        shell: bash
        # macOS's app-image bundler rejects an app-version whose first number
        # is 0 ("The first number in an app-version cannot be zero or
        # negative"), which the 4.x version line (see the trigger comment
        # above) satisfies anyway.
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
          elif [[ -n "${RELEASE_TAG_INPUT}" ]]; then
            TAG="${RELEASE_TAG_INPUT}"
          fi
          if [[ -n "${TAG:-}" ]]; then
            echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=4.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build portable app image with jpackage
        shell: bash
        run: |
          jpackage \
            --type app-image \
            --name dis6502 \
            --input dis6502/target \
            --main-jar dis6502.jar \
            --main-class com.wudsn.tools.dis6502.Dis6502 \
            --app-version "${{ steps.version.outputs.version }}" \
            --description "DIS6502 - The Interactive MOS 6502 Disassembler" \
            --vendor "wudsn.com" \
            --icon "${{ matrix.icon }}" \
            --add-modules ALL-MODULE-PATH \
            --dest dist

      - name: Archive app image (Windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: Compress-Archive -Path dist/dis6502 -DestinationPath dis6502-windows-${{ matrix.arch }}.zip

      - name: Archive app image (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: tar czf dis6502-linux-${{ matrix.arch }}.tar.gz -C dist dis6502

      - name: Archive app image (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        run: tar czf dis6502-macos-${{ matrix.arch }}.tar.gz -C dist dis6502.app

      # The artifact name must be unique per job: upload-artifact v4 fails
      # on a name a parallel job already used.
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dis6502-${{ matrix.platform }}-${{ matrix.arch }}
          path: dis6502-${{ matrix.platform }}-${{ matrix.arch }}.*
          if-no-files-found: error

  release:
    if: github.ref_type == 'tag' || github.event.inputs.release_tag != ''
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine release tag
        id: tag
        shell: bash
        env:
          RELEASE_TAG_INPUT: ${{ github.event.inputs.release_tag }}
        run: |
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${RELEASE_TAG_INPUT}" >> "$GITHUB_OUTPUT"
          fi

      # tag_name targets an existing release/tag when republishing via
      # release_tag - the action updates that release's assets/notes in
      # place rather than creating a new one, and does not move the git tag.
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          files: artifacts/*/*
          generate_release_notes: true
